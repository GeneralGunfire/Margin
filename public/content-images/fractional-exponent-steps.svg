<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-label="Animated steps: 16 to the power 3 over 4 becomes the fourth root of 16 cubed, then 2 cubed, then 8">
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; fill: #1b2733; }
    .n { font-family: system-ui, Arial, sans-serif; font-size: 14px; fill: #5a6b7b; }
    .s { font-family: Georgia, serif; font-size: 18px; fill: #1b2733; }
    .hl { fill: #1565c0; }
    .ok { fill: #2e7d32; }
    .row { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .r1 { animation-name: k1; } .r2 { animation-name: k2; } .r3 { animation-name: k3; } .r4 { animation-name: k4; }
    @keyframes k1 { 0%,2% { opacity: 0; } 6%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes k2 { 0%,22% { opacity: 0; } 26%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes k3 { 0%,42% { opacity: 0; } 46%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes k4 { 0%,62% { opacity: 0; } 66%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>
  <rect width="560" height="250" rx="12" fill="#ffffff" stroke="#d5dde5"/>
  <text x="24" y="30" class="n">Evaluate 16^(3/4) without a calculator</text>

  <g class="row r1">
    <text x="24" y="80" class="t">16<tspan dy="-14" font-size="20" class="hl">3/4</tspan></text>
    <text x="250" y="78" class="n">Denominator 4 = the root. Numerator 3 = the power.</text>
  </g>
  <g class="row r2">
    <text x="24" y="130" class="t">= (<tspan class="hl">⁴√16</tspan>)<tspan dy="-14" font-size="20">3</tspan></text>
    <text x="250" y="128" class="n">Root first, power second.</text>
  </g>
  <g class="row r3">
    <text x="24" y="180" class="t">= 2<tspan dy="-14" font-size="20" class="hl">3</tspan></text>
    <text x="250" y="178" class="n">2 × 2 × 2 × 2 = 16, so the 4th root is 2.</text>
  </g>
  <g class="row r4">
    <text x="24" y="228" class="t ok">= 8</text>
    <text x="250" y="226" class="n">2 × 2 × 2 = 8. Done.</text>
  </g>
</svg>
